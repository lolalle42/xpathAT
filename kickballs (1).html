<!DOCTYPE html>
<html>
<head>
  <title>Kick Balls</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a12;
      color: #e0e0ff;
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px 10px;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(80,40,180,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 100%, rgba(0,200,160,0.10) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    #ui {
      position: relative;
      z-index: 1;
      width: 420px;
      max-width: 100%;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c8b4ff;
      text-shadow: 0 0 20px rgba(170,120,255,0.5);
    }
    .stats { display: flex; gap: 16px; }
    .stat { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-label { font-size: 9px; letter-spacing: 2px; color: #6860a0; text-transform: uppercase; }
    .stat-value { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: #e8d8ff; }
    #stat-balls .stat-value { color: #60e8d0; }
    .canvas-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(160,120,255,0.25);
      box-shadow: 0 0 0 1px rgba(100,60,200,0.15), 0 8px 40px rgba(80,40,180,0.3), inset 0 0 60px rgba(0,0,0,0.4);
    }
    canvas { display: block; background: #0d0d1a; }

    /* ── shared overlay base ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8,6,20,0.92);
      backdrop-filter: blur(6px);
      z-index: 10;
      gap: 18px;
    }
    .screen-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .screen-title.splash { font-size: 38px; color: #c8b4ff; text-shadow: 0 0 40px rgba(170,120,255,0.7); }
    .screen-title.gameover { font-size: 32px; color: #ff6080; text-shadow: 0 0 30px rgba(255,60,80,0.6); }
    .screen-sub {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: #6860a0;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.8;
      max-width: 260px;
    }
    .final-score { font-family: 'Orbitron', sans-serif; font-size: 16px; color: #c0a8ff; letter-spacing: 2px; }
    .screen-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 13px 36px;
      background: transparent;
      color: #c8b4ff;
      border: 1px solid rgba(160,120,255,0.5);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .screen-btn:hover {
      background: rgba(160,120,255,0.15);
      border-color: rgba(160,120,255,0.9);
      color: #e8d8ff;
      box-shadow: 0 0 20px rgba(160,120,255,0.3);
    }
    .splash-icon {
      font-size: 52px;
      line-height: 1;
      margin-bottom: -4px;
    }
    #hint { margin-top: 10px; font-size: 11px; letter-spacing: 1.5px; color: #4a4470; text-align: center; }
  </style>
</head>
<body>
  <div id="ui">
    <header>
      <h1>Kickball</h1>
      <div class="stats">
        <div class="stat" id="stat-balls">
          <span class="stat-label">Balls</span>
          <span class="stat-value" id="ball-count">1</span>
        </div>
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="score-display">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Round</span>
          <span class="stat-value" id="round-display">1</span>
        </div>
      </div>
    </header>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="420" height="540"></canvas>

      <!-- Splash screen -->
      <div id="splash" class="screen">
        <div class="splash-icon">⚡</div>
        <div class="screen-title splash">KICKBALL</div>
        <div class="screen-sub">Drag to aim · Release to fire<br>Collect orbs for extra balls<br>Don't let bricks reach the bottom</div>
        <button class="screen-btn" onclick="startGame()">START GAME</button>
      </div>

      <!-- Game over screen -->
      <div id="gameover" class="screen" style="display:none;">
        <div class="screen-title gameover">GAME OVER</div>
        <div class="final-score" id="final-score-text">SCORE: 0</div>
        <button class="screen-btn" onclick="restartGame()">PLAY AGAIN</button>
      </div>
    </div>
    <p id="hint">DRAG TO AIM · RELEASE TO FIRE</p>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ── Grid: 7 cols × 9 rows ──────────────────────────────────
    // Row 0 = top clear zone
    // Rows 1-7 = play area (bricks live here)
    // Row 8 = launcher row (bottom clear zone)
    const COLS = 7;
    const ROWS = 9;
    const W = canvas.width;   // 420
    const H = canvas.height;  // 540
    const BSIZE = W / COLS;   // 60px exactly — fills edge to edge
    const BALL_SPEED = 7;

    // Launcher sits in the middle of row 8
    const LAUNCH_Y = H - BSIZE / 2;
    const LAUNCH_X = W / 2;

    // Bricks spawn at the top of row 1 (y = BSIZE)
    const SPAWN_Y = BSIZE;
    // Danger zone: bricks reaching row 8 = game over
    const DANGER_Y = BSIZE * 8; // row 8 top edge

    const BRICK_PALETTES = [
      { fill: '#2a1a4a', stroke: '#8860e0', text: '#c8a8ff', glow: 'rgba(136,96,224,0.5)' },
      { fill: '#0d2a2a', stroke: '#20c8a0', text: '#80f0d8', glow: 'rgba(32,200,160,0.5)' },
      { fill: '#2a1422', stroke: '#e05080', text: '#ffa0c0', glow: 'rgba(224,80,128,0.5)' },
      { fill: '#1a1a10', stroke: '#c0a020', text: '#f0d060', glow: 'rgba(192,160,32,0.5)' },
    ];

    let balls = [], bricks = [], powerups = [], particles = [];
    let numBalls = 1, score = 0, round = 1;
    let aiming = false, aimX = LAUNCH_X, aimY = LAUNCH_Y - 50;
    let turnActive = false, ballsPending = 0;
    let gameRunning = false, gameOver = false;

    // ── Particle ───────────────────────────────────────────────
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        const a = Math.random() * Math.PI * 2;
        const s = 1.5 + Math.random() * 3.5;
        this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
        this.life = 1;
        this.decay = 0.04 + Math.random() * 0.04;
        this.size = 2 + Math.random() * 3;
        this.color = color;
      }
      update() { this.x += this.vx; this.y += this.vy; this.vy += 0.08; this.life -= this.decay; }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.size * this.life), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
    }

    // ── Ball ───────────────────────────────────────────────────
    class Ball {
      constructor(x, y, dx, dy) {
        this.x = x; this.y = y; this.dx = dx; this.dy = dy;
        this.r = 7; this.trail = []; this.active = true;
      }
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 8) this.trail.shift();
        this.x += this.dx; this.y += this.dy;
        if (this.x < this.r)     { this.x = this.r;     this.dx =  Math.abs(this.dx); }
        if (this.x > W - this.r) { this.x = W - this.r; this.dx = -Math.abs(this.dx); }
        if (this.y < this.r)     { this.y = this.r;     this.dy =  Math.abs(this.dy); }
        if (this.y >= H - this.r) { this.active = false; return; }

        // Brick collisions
        for (let i = bricks.length - 1; i >= 0; i--) {
          const b = bricks[i];
          if (this.x + this.r > b.x && this.x - this.r < b.x + BSIZE &&
              this.y + this.r > b.y && this.y - this.r < b.y + BSIZE) {
            const overlapX = Math.min(this.x + this.r - b.x, b.x + BSIZE - (this.x - this.r));
            const overlapY = Math.min(this.y + this.r - b.y, b.y + BSIZE - (this.y - this.r));
            if (overlapX < overlapY) this.dx *= -1; else this.dy *= -1;
            const palette = BRICK_PALETTES[b.colorIdx];
            if (b.hit()) {
              spawnParticles(b.x + BSIZE / 2, b.y + BSIZE / 2, palette.stroke, 16);
              score += b.maxHits;
              bricks.splice(i, 1);
            } else {
              spawnParticles(b.x + BSIZE / 2, b.y + BSIZE / 2, palette.stroke, 5);
            }
            break;
          }
        }
        // Powerup collisions
        for (let i = powerups.length - 1; i >= 0; i--) {
          const p = powerups[i];
          if (Math.hypot(this.x - p.x, this.y - p.y) < this.r + p.r) {
            numBalls++;
            spawnParticles(p.x, p.y, '#60e8d0', 12);
            document.getElementById('ball-count').textContent = numBalls;
            powerups.splice(i, 1);
          }
        }
      }
      draw() {
        this.trail.forEach((t, i) => {
          ctx.save();
          ctx.globalAlpha = (i / this.trail.length) * 0.35;
          ctx.fillStyle = '#a080ff';
          ctx.beginPath();
          ctx.arc(t.x, t.y, Math.max(0.1, this.r * (i / this.trail.length)), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        ctx.save();
        ctx.shadowBlur = 14; ctx.shadowColor = '#a080ff';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = '#e8d8ff'; ctx.fill();
        ctx.restore();
        ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0.1, this.r - 2), 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff'; ctx.fill();
      }
    }

    // ── Brick ──────────────────────────────────────────────────
    class Brick {
      constructor(x, y, hits, colorIdx) {
        this.x = x; this.y = y; this.hits = hits; this.maxHits = hits; this.colorIdx = colorIdx;
        this.shakeX = 0; this.shakeFade = 0;
      }
      draw() {
        const p = BRICK_PALETTES[this.colorIdx];
        const ratio = this.hits / this.maxHits;
        const sx = this.shakeX * this.shakeFade;
        const pad = 3;
        const rx = this.x + sx + pad, ry = this.y + pad;
        const bw = BSIZE - pad * 2, bh = BSIZE - pad * 2;

        ctx.save();
        ctx.shadowBlur = 8; ctx.shadowColor = p.glow;
        ctx.fillStyle = p.fill;
        roundRect(rx, ry, bw, bh, 5); ctx.fill();

        // Health bar
        ctx.globalAlpha = 0.25; ctx.fillStyle = p.stroke;
        roundRect(rx + 4, ry + bh - 8, bw - 8, 4, 2); ctx.fill();
        ctx.globalAlpha = 0.85; ctx.fillStyle = p.stroke;
        roundRect(rx + 4, ry + bh - 8, Math.max(0, (bw - 8) * ratio), 4, 2); ctx.fill();

        ctx.globalAlpha = 1; ctx.strokeStyle = p.stroke; ctx.lineWidth = 1;
        roundRect(rx, ry, bw, bh, 5); ctx.stroke();
        ctx.restore();

        const fs = this.hits >= 100 ? 11 : this.hits >= 10 ? 13 : 16;
        ctx.save();
        ctx.font = `bold ${fs}px 'Orbitron', monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = p.text;
        ctx.shadowBlur = 6; ctx.shadowColor = p.glow;
        ctx.fillText(this.hits, rx + bw / 2, ry + bh / 2 - 3);
        ctx.restore();

        if (this.shakeFade > 0) this.shakeFade -= 0.1;
      }
      hit() { this.hits--; this.shakeX = 4; this.shakeFade = 1; return this.hits <= 0; }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // ── Powerup ────────────────────────────────────────────────
    class Powerup {
      constructor(x, y) { this.x = x; this.y = y; this.r = 10; this.pulse = 0; }
      draw() {
        this.pulse += 0.06;
        const s = 1 + 0.15 * Math.sin(this.pulse);
        ctx.save();
        ctx.shadowBlur = 20; ctx.shadowColor = '#40f0c0';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r * s, 0, Math.PI * 2);
        ctx.strokeStyle = '#60e8d0'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = 'rgba(96,232,208,0.15)'; ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.font = 'bold 10px Orbitron'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#60e8d0'; ctx.fillText('+1', this.x, this.y);
        ctx.restore();
      }
    }

    // ── Row Spawning ───────────────────────────────────────────
    function spawnRow() {
      const baseHits = Math.floor(round * 1.5) + Math.floor(Math.random() * round);
      // Bricks always spawn at row 1 (y = BSIZE), x aligned to grid columns (no offset — edge to edge)
      for (let col = 0; col < COLS; col++) {
        const r = Math.random();
        const x = col * BSIZE;
        if (r < 0.6) {
          const h = Math.max(1, baseHits + Math.floor(Math.random() * 4 - 2));
          bricks.push(new Brick(x, SPAWN_Y, h, Math.floor(Math.random() * BRICK_PALETTES.length)));
        } else if (r < 0.72) {
          powerups.push(new Powerup(x + BSIZE / 2, SPAWN_Y + BSIZE / 2));
        }
        // else empty cell
      }
    }

    function dropAll() {
      bricks.forEach(b => b.y += BSIZE);
      powerups.forEach(p => p.y += BSIZE);
      for (let i = bricks.length - 1; i >= 0; i--) {
        if (bricks[i].y >= DANGER_Y) { endGame(); return; }
      }
    }

    // ── Firing ────────────────────────────────────────────────
    function fireBalls(tx, ty) {
      if (turnActive || gameOver || !gameRunning) return;
      const dist = Math.hypot(tx - LAUNCH_X, ty - LAUNCH_Y);
      if (dist < 20 || ty >= LAUNCH_Y - 10) return;
      turnActive = true;
      ballsPending = numBalls;
      const nx = (tx - LAUNCH_X) / dist;
      const ny = (ty - LAUNCH_Y) / dist;
      for (let i = 0; i < numBalls; i++) {
        setTimeout(() => {
          balls.push(new Ball(LAUNCH_X, LAUNCH_Y, nx * BALL_SPEED, ny * BALL_SPEED));
          ballsPending--;
        }, i * 80);
      }
    }

    // ── Aim Line ──────────────────────────────────────────────
    function drawAim(tx, ty) {
      if (!aiming || turnActive) return;
      const dist = Math.hypot(tx - LAUNCH_X, ty - LAUNCH_Y);
      if (dist < 20 || ty >= LAUNCH_Y - 10) return;
      const nx = (tx - LAUNCH_X) / dist, ny = (ty - LAUNCH_Y) / dist;
      ctx.save();
      ctx.setLineDash([6, 8]);
      ctx.lineDashOffset = -performance.now() / 80;
      ctx.strokeStyle = 'rgba(200,180,255,0.5)';
      ctx.lineWidth = 1.5;
      let x = LAUNCH_X, y = LAUNCH_Y, dx = nx * BALL_SPEED, dy = ny * BALL_SPEED;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let s = 0; s < 80; s++) {
        x += dx; y += dy;
        if (x < 7) { x = 7; dx = Math.abs(dx); }
        if (x > W - 7) { x = W - 7; dx = -Math.abs(dx); }
        if (y < 7 || y > LAUNCH_Y) break;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(200,180,255,0.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tx, ty, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // ── Floor / Launcher ──────────────────────────────────────
    function drawFloor() {
      // Danger line at top of row 8
      ctx.save();
      ctx.strokeStyle = 'rgba(255,80,100,0.25)'; ctx.lineWidth = 1;
      ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
      ctx.setLineDash([]);

      // Launcher dot
      ctx.shadowBlur = 12; ctx.shadowColor = '#a080ff';
      ctx.beginPath(); ctx.arc(LAUNCH_X, LAUNCH_Y, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#c8b4ff'; ctx.fill();
      ctx.beginPath(); ctx.arc(LAUNCH_X, LAUNCH_Y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.restore();
    }

    function drawScanlines() {
      ctx.save();
      ctx.globalAlpha = 0.025;
      for (let y = 0; y < H; y += 3) { ctx.fillStyle = '#000'; ctx.fillRect(0, y, W, 1); }
      ctx.restore();
    }

    // ── Game State ────────────────────────────────────────────
    function startGame() {
      document.getElementById('splash').style.display = 'none';
      gameRunning = true;
      spawnRow();
    }

    function endGame() {
      gameOver = true; gameRunning = false;
      document.getElementById('final-score-text').textContent = `SCORE: ${score}`;
      document.getElementById('gameover').style.display = 'flex';
    }

    function restartGame() {
      balls = []; bricks = []; powerups = []; particles = [];
      numBalls = 1; score = 0; round = 1;
      turnActive = false; ballsPending = 0; gameOver = false; aiming = false; gameRunning = true;
      document.getElementById('ball-count').textContent = '1';
      document.getElementById('score-display').textContent = '0';
      document.getElementById('round-display').textContent = '1';
      document.getElementById('gameover').style.display = 'none';
      spawnRow();
    }

    // ── Input ─────────────────────────────────────────────────
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cl = e.touches ? e.touches[0] : e;
      return { x: (cl.clientX - rect.left) * (W / rect.width), y: (cl.clientY - rect.top) * (H / rect.height) };
    }
    canvas.addEventListener('mousedown', e => { if (gameRunning && !turnActive) { aiming = true; const p = getPos(e); aimX = p.x; aimY = p.y; }});
    canvas.addEventListener('mousemove', e => { if (aiming) { const p = getPos(e); aimX = p.x; aimY = p.y; }});
    canvas.addEventListener('mouseup',   e => { if (aiming) { aiming = false; const p = getPos(e); fireBalls(p.x, p.y); }});
    canvas.addEventListener('touchstart', e => { e.preventDefault(); if (gameRunning && !turnActive) { aiming = true; const p = getPos(e); aimX = p.x; aimY = p.y; }}, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); const p = getPos(e); aimX = p.x; aimY = p.y; }, { passive: false });
    canvas.addEventListener('touchend',   e => { e.preventDefault(); if (aiming) { aiming = false; fireBalls(aimX, aimY); }}, { passive: false });

    // ── Game Loop ─────────────────────────────────────────────
    function gameLoop() {
      ctx.clearRect(0, 0, W, H);

      // Subtle grid lines aligned to BSIZE cells
      ctx.save();
      ctx.strokeStyle = 'rgba(100,80,160,0.07)'; ctx.lineWidth = 1;
      for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c * BSIZE, 0); ctx.lineTo(c * BSIZE, H); ctx.stroke(); }
      for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * BSIZE); ctx.lineTo(W, r * BSIZE); ctx.stroke(); }
      ctx.restore();

      if (gameRunning || gameOver) {
        bricks.forEach(b => b.draw());
        powerups.forEach(p => p.draw());

        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update(); particles[i].draw();
          if (particles[i].life <= 0) particles.splice(i, 1);
        }

        for (let i = balls.length - 1; i >= 0; i--) {
          balls[i].update(); balls[i].draw();
          if (!balls[i].active) balls.splice(i, 1);
        }

        if (turnActive && ballsPending === 0 && balls.length === 0) {
          turnActive = false;
          if (!gameOver) {
            dropAll();
            if (!gameOver) {
              spawnRow();
              round++;
              document.getElementById('round-display').textContent = round;
            }
          }
        }

        document.getElementById('score-display').textContent = score;
        drawFloor();
        drawAim(aimX, aimY);
      }

      drawScanlines();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
