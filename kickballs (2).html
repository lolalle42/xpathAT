<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kick Balls</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a12;
      color: #e0e0ff;
      font-family: 'Share Tech Mono', monospace;
      touch-action: none;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(80,40,180,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 100%, rgba(0,200,160,0.10) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    #ui {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 0);
    }
    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 6px;
      flex-shrink: 0;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(16px, 5vw, 26px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c8b4ff;
      text-shadow: 0 0 20px rgba(170,120,255,0.5);
    }
    .stats { display: flex; gap: 14px; }
    .stat { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-label { font-size: clamp(7px, 2vw, 9px); letter-spacing: 2px; color: #6860a0; text-transform: uppercase; }
    .stat-value { font-family: 'Orbitron', sans-serif; font-size: clamp(14px, 4vw, 18px); font-weight: 700; color: #e8d8ff; }
    #stat-balls .stat-value { color: #60e8d0; }
    .canvas-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(160,120,255,0.25);
      box-shadow: 0 0 0 1px rgba(100,60,200,0.15), 0 8px 40px rgba(80,40,180,0.3), inset 0 0 60px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }
    canvas { display: block; background: #0d0d1a; }
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(8,6,20,0.92);
      backdrop-filter: blur(6px);
      z-index: 10; gap: 16px;
    }
    .screen-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .screen-title.splash { font-size: clamp(24px, 8vw, 38px); color: #c8b4ff; text-shadow: 0 0 40px rgba(170,120,255,0.7); }
    .screen-title.gameover { font-size: clamp(20px, 7vw, 32px); color: #ff6080; text-shadow: 0 0 30px rgba(255,60,80,0.6); }
    .screen-sub {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(10px, 3vw, 13px);
      color: #6860a0; letter-spacing: 2px;
      text-align: center; line-height: 1.8;
      max-width: 260px;
    }
    .final-score { font-family: 'Orbitron', sans-serif; font-size: clamp(13px, 4vw, 16px); color: #c0a8ff; letter-spacing: 2px; }
    .screen-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      padding: 13px 36px;
      background: transparent; color: #c8b4ff;
      border: 1px solid rgba(160,120,255,0.5);
      border-radius: 6px; cursor: pointer;
      transition: all 0.2s; margin-top: 4px;
    }
    .screen-btn:hover, .screen-btn:active {
      background: rgba(160,120,255,0.15);
      border-color: rgba(160,120,255,0.9);
      color: #e8d8ff;
      box-shadow: 0 0 20px rgba(160,120,255,0.3);
    }
    .splash-icon { font-size: clamp(36px, 11vw, 52px); line-height: 1; margin-bottom: -4px; }
    #hint { flex-shrink: 0; padding: 6px 0 4px; font-size: clamp(9px, 2.5vw, 11px); letter-spacing: 1.5px; color: #4a4470; text-align: center; }
  </style>
</head>
<body>
  <div id="ui">
    <header>
      <h1>Kickball</h1>
      <div class="stats">
        <div class="stat" id="stat-balls">
          <span class="stat-label">Balls</span>
          <span class="stat-value" id="ball-count">1</span>
        </div>
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="score-display">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Round</span>
          <span class="stat-value" id="round-display">1</span>
        </div>
      </div>
    </header>

    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>

      <div id="splash" class="screen">
        <div class="splash-icon">⚡</div>
        <div class="screen-title splash">KICKBALL</div>
        <div class="screen-sub">Drag to aim · Release to fire<br>Collect orbs for extra balls<br>Don't let bricks reach the bottom</div>
        <button class="screen-btn" onclick="startGame()">START GAME</button>
      </div>

      <div id="gameover" class="screen" style="display:none;">
        <div class="screen-title gameover">GAME OVER</div>
        <div class="final-score" id="final-score-text">SCORE: 0</div>
        <button class="screen-btn" onclick="restartGame()">PLAY AGAIN</button>
      </div>
    </div>
    <p id="hint">DRAG TO AIM · RELEASE TO FIRE</p>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ── Responsive sizing ───────────────────────────────────────
    const COLS = 7;
    const ROWS = 9;
    let W, H, BSIZE, BALL_SPEED, LAUNCH_X, LAUNCH_Y, SPAWN_Y, DANGER_Y;

    function resize() {
      const header = document.querySelector('header');
      const hint   = document.getElementById('hint');
      const ui     = document.getElementById('ui');
      const wrap   = document.getElementById('canvas-wrap');

      const uiH = ui.clientHeight;
      const headerH = header.offsetHeight;
      const hintH   = hint.offsetHeight;
      const vPad = 12; // small breathing room

      const availW = window.innerWidth;
      const availH = uiH - headerH - hintH - vPad;

      // Canvas must keep 7:9 grid ratio
      const ratio = COLS / ROWS; // width/height
      let cw = availW;
      let ch = Math.round(cw / ratio);
      if (ch > availH) {
        ch = availH;
        cw = Math.round(ch * ratio);
      }
      // Snap to grid
      cw = Math.floor(cw / COLS) * COLS;
      ch = Math.floor(ch / ROWS) * ROWS;

      canvas.width  = cw;
      canvas.height = ch;
      canvas.style.width  = cw + 'px';
      canvas.style.height = ch + 'px';
      wrap.style.width  = cw + 'px';
      wrap.style.height = ch + 'px';

      W = cw; H = ch;
      BSIZE      = W / COLS;
      BALL_SPEED = Math.max(4, BSIZE * 0.11);
      LAUNCH_X   = W / 2;
      LAUNCH_Y   = H - BSIZE * 0.25;  // closer to bottom edge
      SPAWN_Y    = BSIZE;
      DANGER_Y   = BSIZE * 8;

      // Reposition existing objects to new grid
      bricks.forEach(b => {
        b.x = Math.round(b.col * BSIZE);
        b.y = Math.round(b.row * BSIZE);
        if (b.startY !== undefined) { b.startY = b.startRow * BSIZE; b.targetY = b.targetRow * BSIZE; }
      });
      powerups.forEach(p => {
        p.x = Math.round(p.col * BSIZE + BSIZE / 2);
        p.y = Math.round(p.row * BSIZE + BSIZE / 2);
        if (p.startY !== undefined) { p.startY = p.startRow * BSIZE + BSIZE/2; p.targetY = p.targetRow * BSIZE + BSIZE/2; }
      });
    }

    const BRICK_PALETTES = [
      { fill: '#2a1a4a', stroke: '#8860e0', text: '#c8a8ff', glow: 'rgba(136,96,224,0.5)' },
      { fill: '#0d2a2a', stroke: '#20c8a0', text: '#80f0d8', glow: 'rgba(32,200,160,0.5)' },
      { fill: '#2a1422', stroke: '#e05080', text: '#ffa0c0', glow: 'rgba(224,80,128,0.5)' },
      { fill: '#1a1a10', stroke: '#c0a020', text: '#f0d060', glow: 'rgba(192,160,32,0.5)' },
    ];

    let balls = [], bricks = [], powerups = [], particles = [];
    let numBalls = 1, score = 0, round = 1;
    let aiming = false, aimX = 0, aimY = 0;
    let turnActive = false, ballsPending = 0;
    let gameRunning = false, gameOver = false;

    // Drop animation
    let dropAnimating = false;
    const DROP_DURATION = 18;
    let dropFrame = 0;

    // Pending new balls to drop (collected during round)
    let pendingNewBalls = [];

    // ── Particle ───────────────────────────────────────────────
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        const a = Math.random() * Math.PI * 2;
        const s = 1.5 + Math.random() * 3.5;
        this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
        this.life = 1;
        this.decay = 0.04 + Math.random() * 0.04;
        this.size = 2 + Math.random() * 3;
        this.color = color;
      }
      update() { this.x += this.vx; this.y += this.vy; this.vy += 0.08; this.life -= this.decay; }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.size * this.life), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
    }

    // ── Ball ───────────────────────────────────────────────────
    class Ball {
      constructor(x, y, dx, dy) {
        this.x = x; this.y = y; this.dx = dx; this.dy = dy;
        this.r = Math.max(5, BSIZE * 0.115);
        this.trail = []; this.active = true;
      }
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 8) this.trail.shift();
        this.x += this.dx; this.y += this.dy;
        if (this.x < this.r)     { this.x = this.r;     this.dx =  Math.abs(this.dx); }
        if (this.x > W - this.r) { this.x = W - this.r; this.dx = -Math.abs(this.dx); }
        if (this.y < this.r)     { this.y = this.r;     this.dy =  Math.abs(this.dy); }
        if (this.y >= H - this.r) { this.active = false; return; }

        for (let i = bricks.length - 1; i >= 0; i--) {
          const b = bricks[i];
          if (this.x + this.r > b.x && this.x - this.r < b.x + BSIZE &&
              this.y + this.r > b.y && this.y - this.r < b.y + BSIZE) {
            const overlapX = Math.min(this.x + this.r - b.x, b.x + BSIZE - (this.x - this.r));
            const overlapY = Math.min(this.y + this.r - b.y, b.y + BSIZE - (this.y - this.r));
            if (overlapX < overlapY) this.dx *= -1; else this.dy *= -1;
            const palette = BRICK_PALETTES[b.colorIdx];
            if (b.hit()) {
              spawnParticles(b.x + BSIZE / 2, b.y + BSIZE / 2, palette.stroke, 16);
              score += b.maxHits;
              bricks.splice(i, 1);
            } else {
              spawnParticles(b.x + BSIZE / 2, b.y + BSIZE / 2, palette.stroke, 5);
            }
            break;
          }
        }
        for (let i = powerups.length - 1; i >= 0; i--) {
          const p = powerups[i];
          if (Math.hypot(this.x - p.x, this.y - p.y) < this.r + p.r) {
            numBalls++;
            spawnParticles(p.x, p.y, '#60e8d0', 12);
            document.getElementById('ball-count').textContent = numBalls;
            pendingNewBalls.push({ x: p.x, y: -10, vy: 2.5, landed: false });
            powerups.splice(i, 1);
          }
        }
      }
      draw() {
        this.trail.forEach((t, i) => {
          ctx.save();
          ctx.globalAlpha = (i / this.trail.length) * 0.35;
          ctx.fillStyle = '#a080ff';
          ctx.beginPath();
          ctx.arc(t.x, t.y, Math.max(0.1, this.r * (i / this.trail.length)), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        ctx.save();
        ctx.shadowBlur = 14; ctx.shadowColor = '#a080ff';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = '#e8d8ff'; ctx.fill();
        ctx.restore();
        ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0.1, this.r - 2), 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff'; ctx.fill();
      }
    }

    // ── Brick ──────────────────────────────────────────────────
    class Brick {
      constructor(col, row, hits, colorIdx) {
        this.col = col; this.row = row;
        this.x = col * BSIZE; this.y = row * BSIZE;
        this.hits = hits; this.maxHits = hits; this.colorIdx = colorIdx;
        this.shakeX = 0; this.shakeFade = 0;
      }
      draw() {
        const p = BRICK_PALETTES[this.colorIdx];
        const ratio = this.hits / this.maxHits;
        const sx = this.shakeX * this.shakeFade;
        const pad = Math.max(2, BSIZE * 0.05);
        const rx = this.x + sx + pad, ry = this.y + pad;
        const bw = BSIZE - pad * 2, bh = BSIZE - pad * 2;

        ctx.save();
        ctx.shadowBlur = 8; ctx.shadowColor = p.glow;
        ctx.fillStyle = p.fill;
        roundRect(rx, ry, bw, bh, 5); ctx.fill();

        ctx.globalAlpha = 0.25; ctx.fillStyle = p.stroke;
        roundRect(rx + 4, ry + bh - 8, bw - 8, 4, 2); ctx.fill();
        ctx.globalAlpha = 0.85; ctx.fillStyle = p.stroke;
        roundRect(rx + 4, ry + bh - 8, Math.max(0, (bw - 8) * ratio), 4, 2); ctx.fill();

        ctx.globalAlpha = 1; ctx.strokeStyle = p.stroke; ctx.lineWidth = 1;
        roundRect(rx, ry, bw, bh, 5); ctx.stroke();
        ctx.restore();

        const fs = this.hits >= 100 ? Math.max(8, BSIZE * 0.18) : this.hits >= 10 ? Math.max(10, BSIZE * 0.21) : Math.max(12, BSIZE * 0.26);
        ctx.save();
        ctx.font = `bold ${fs}px 'Orbitron', monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = p.text;
        ctx.shadowBlur = 6; ctx.shadowColor = p.glow;
        ctx.fillText(this.hits, rx + bw / 2, ry + bh / 2 - 3);
        ctx.restore();

        if (this.shakeFade > 0) this.shakeFade -= 0.1;
      }
      hit() { this.hits--; this.shakeX = 4; this.shakeFade = 1; return this.hits <= 0; }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // ── Powerup ────────────────────────────────────────────────
    class Powerup {
      constructor(col, row) {
        this.col = col; this.row = row;
        this.x = col * BSIZE + BSIZE / 2;
        this.y = row * BSIZE + BSIZE / 2;
        this.r = Math.max(8, BSIZE * 0.16);
        this.pulse = 0;
      }
      draw() {
        this.pulse += 0.06;
        const s = 1 + 0.15 * Math.sin(this.pulse);
        ctx.save();
        ctx.shadowBlur = 20; ctx.shadowColor = '#40f0c0';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r * s, 0, Math.PI * 2);
        ctx.strokeStyle = '#60e8d0'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = 'rgba(96,232,208,0.15)'; ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.font = `bold ${Math.max(8, BSIZE * 0.17)}px Orbitron`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#60e8d0'; ctx.fillText('+1', this.x, this.y);
        ctx.restore();
      }
    }

    // ── Row Spawning ───────────────────────────────────────────
    function rowValue(r) {
      // Sequence: 1,2,3,4,10, 6,7,8,9,20, 11,12,13,14,30...
      // Every 5th round (r % 5 === 0) the value is doubled: (r/5)*10
      // Otherwise the value is just r
      return (r % 5 === 0) ? (r / 5) * 10 : r;
    }

    function spawnRow() {
      const rowHits = rowValue(round);
      // Pick one guaranteed powerup column
      const powerupCol = Math.floor(Math.random() * COLS);
      for (let col = 0; col < COLS; col++) {
        if (col === powerupCol) {
          powerups.push(new Powerup(col, 1));
        } else if (Math.random() < 0.7) {
          bricks.push(new Brick(col, 1, rowHits, Math.floor(Math.random() * BRICK_PALETTES.length)));
        }
      }
    }

    function easeInOutQuad(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    function dropAll() {
      dropAnimating = true;
      dropFrame = 0;
      bricks.forEach(b => {
        b.startRow = b.row; b.targetRow = b.row + 1;
        b.startY = b.y; b.targetY = b.y + BSIZE;
      });
      powerups.forEach(p => {
        p.startRow = p.row; p.targetRow = p.row + 1;
        p.startY = p.y; p.targetY = p.y + BSIZE;
      });
    }

    function updateDropAnimation() {
      if (!dropAnimating) return;
      dropFrame++;
      const t = Math.min(dropFrame / DROP_DURATION, 1);
      const e = easeInOutQuad(t);
      bricks.forEach(b => { b.y = b.startY + (b.targetY - b.startY) * e; });
      powerups.forEach(p => { p.y = p.startY + (p.targetY - p.startY) * e; });
      if (t >= 1) {
        dropAnimating = false;
        bricks.forEach(b => { b.row = b.targetRow; b.y = b.targetRow * BSIZE; });
        powerups.forEach(p => { p.row = p.targetRow; p.y = p.targetRow * BSIZE + BSIZE / 2; });
        for (let i = bricks.length - 1; i >= 0; i--) {
          if (bricks[i].y >= DANGER_Y) { endGame(); return; }
        }
        if (!gameOver) {
          spawnRow();
          round++;
          document.getElementById('round-display').textContent = round;
          // Remove any powerups that reached the bottom (not collected)
          powerups = powerups.filter(p => p.row < 8);
        }
      }
    }

    // ── Firing ────────────────────────────────────────────────
    function fireBalls(tx, ty) {
      if (turnActive || gameOver || !gameRunning) return;
      const dist = Math.hypot(tx - LAUNCH_X, ty - LAUNCH_Y);
      if (dist < 20 || ty >= LAUNCH_Y - 10) return;
      turnActive = true;
      ballsPending = numBalls;
      const nx = (tx - LAUNCH_X) / dist;
      const ny = (ty - LAUNCH_Y) / dist;
      for (let i = 0; i < numBalls; i++) {
        setTimeout(() => {
          balls.push(new Ball(LAUNCH_X, LAUNCH_Y, nx * BALL_SPEED, ny * BALL_SPEED));
          ballsPending--;
        }, i * 80);
      }
    }

    // ── Aim Line ──────────────────────────────────────────────
    function drawAim(tx, ty) {
      if (!aiming || turnActive) return;
      const dist = Math.hypot(tx - LAUNCH_X, ty - LAUNCH_Y);
      if (dist < 20 || ty >= LAUNCH_Y - 10) return;
      const nx = (tx - LAUNCH_X) / dist, ny = (ty - LAUNCH_Y) / dist;
      ctx.save();
      ctx.setLineDash([6, 8]);
      ctx.lineDashOffset = -performance.now() / 80;
      ctx.strokeStyle = 'rgba(200,180,255,0.5)';
      ctx.lineWidth = 1.5;
      let x = LAUNCH_X, y = LAUNCH_Y, dx = nx * BALL_SPEED, dy = ny * BALL_SPEED;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let s = 0; s < 80; s++) {
        x += dx; y += dy;
        if (x < 7) { x = 7; dx = Math.abs(dx); }
        if (x > W - 7) { x = W - 7; dx = -Math.abs(dx); }
        if (y < 7 || y > LAUNCH_Y) break;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(200,180,255,0.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tx, ty, 2.5, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    function drawFloor() {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,80,100,0.25)'; ctx.lineWidth = 1;
      ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
      ctx.setLineDash([]);
      const ballR = Math.max(5, BSIZE * 0.115);
      ctx.shadowBlur = 12; ctx.shadowColor = '#a080ff';
      ctx.beginPath(); ctx.arc(LAUNCH_X, LAUNCH_Y, ballR + 1, 0, Math.PI * 2);
      ctx.fillStyle = '#c8b4ff'; ctx.fill();
      ctx.beginPath(); ctx.arc(LAUNCH_X, LAUNCH_Y, Math.max(3, ballR - 2), 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.restore();
    }

    function drawScanlines() {
      ctx.save();
      ctx.globalAlpha = 0.025;
      for (let y = 0; y < H; y += 3) { ctx.fillStyle = '#000'; ctx.fillRect(0, y, W, 1); }
      ctx.restore();
    }

    // ── Game State ────────────────────────────────────────────
    function startGame() {
      document.getElementById('splash').style.display = 'none';
      gameRunning = true;
      spawnRow();
    }

    function endGame() {
      gameOver = true; gameRunning = false;
      document.getElementById('final-score-text').textContent = `SCORE: ${score}`;
      document.getElementById('gameover').style.display = 'flex';
    }

    function restartGame() {
      balls = []; bricks = []; powerups = []; particles = []; pendingNewBalls = [];
      numBalls = 1; score = 0; round = 1;
      turnActive = false; ballsPending = 0; gameOver = false; aiming = false; gameRunning = true;
      dropAnimating = false; dropFrame = 0;
      document.getElementById('ball-count').textContent = '1';
      document.getElementById('score-display').textContent = '0';
      document.getElementById('round-display').textContent = '1';
      document.getElementById('gameover').style.display = 'none';
      spawnRow();
    }

    // ── Input ─────────────────────────────────────────────────
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cl = e.touches ? e.touches[0] : e;
      return {
        x: (cl.clientX - rect.left) * (W / rect.width),
        y: (cl.clientY - rect.top)  * (H / rect.height)
      };
    }
    canvas.addEventListener('mousedown', e => { if (gameRunning && !turnActive) { aiming = true; const p = getPos(e); aimX = p.x; aimY = p.y; }});
    canvas.addEventListener('mousemove', e => { if (aiming) { const p = getPos(e); aimX = p.x; aimY = p.y; }});
    canvas.addEventListener('mouseup',   e => { if (aiming) { aiming = false; const p = getPos(e); fireBalls(p.x, p.y); }});
    canvas.addEventListener('touchstart', e => { e.preventDefault(); if (gameRunning && !turnActive) { aiming = true; const p = getPos(e); aimX = p.x; aimY = p.y; }}, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); if (aiming) { const p = getPos(e); aimX = p.x; aimY = p.y; } }, { passive: false });
    canvas.addEventListener('touchend',   e => { e.preventDefault(); if (aiming) { aiming = false; fireBalls(aimX, aimY); }}, { passive: false });

    // ── Game Loop ─────────────────────────────────────────────
    function gameLoop() {
      ctx.clearRect(0, 0, W, H);

      ctx.save();
      ctx.strokeStyle = 'rgba(100,80,160,0.07)'; ctx.lineWidth = 1;
      for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c * BSIZE, 0); ctx.lineTo(c * BSIZE, H); ctx.stroke(); }
      for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * BSIZE); ctx.lineTo(W, r * BSIZE); ctx.stroke(); }
      ctx.restore();

      if (gameRunning || gameOver) {
        bricks.forEach(b => b.draw());
        powerups.forEach(p => p.draw());

        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update(); particles[i].draw();
          if (particles[i].life <= 0) particles.splice(i, 1);
        }

        for (let i = balls.length - 1; i >= 0; i--) {
          balls[i].update(); balls[i].draw();
          if (!balls[i].active) balls.splice(i, 1);
        }

        if (turnActive && ballsPending === 0 && balls.length === 0 && !dropAnimating) {
          turnActive = false;
          if (!gameOver) dropAll();
        }

        updateDropAnimation();

        const ballR = Math.max(5, BSIZE * 0.115);
        for (let i = pendingNewBalls.length - 1; i >= 0; i--) {
          const nb = pendingNewBalls[i];
          nb.vy += 0.4;
          nb.y += nb.vy;
          if (nb.y >= LAUNCH_Y) {
            nb.y = LAUNCH_Y;
            nb.vy *= -0.45;
            if (Math.abs(nb.vy) < 1) { pendingNewBalls.splice(i, 1); continue; }
          }
          ctx.save();
          ctx.shadowBlur = 14; ctx.shadowColor = '#60e8d0';
          ctx.beginPath(); ctx.arc(nb.x, nb.y, ballR, 0, Math.PI * 2);
          ctx.fillStyle = '#80f0d8'; ctx.fill();
          ctx.beginPath(); ctx.arc(nb.x, nb.y, Math.max(3, ballR - 2), 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff'; ctx.fill();
          ctx.restore();
        }

        document.getElementById('score-display').textContent = score;
        drawFloor();
        drawAim(aimX, aimY);
      }

      drawScanlines();
      requestAnimationFrame(gameLoop);
    }

    // ── Init ──────────────────────────────────────────────────
    // Initial size (before fonts load, just use pixel dims)
    resize();
    aimX = LAUNCH_X; aimY = LAUNCH_Y - 50;

    window.addEventListener('resize', () => { resize(); });
    // Also handle orientation change
    window.addEventListener('orientationchange', () => { setTimeout(resize, 200); });

    gameLoop();
  </script>
</body>
</html>
